<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script  src="http://code.jquery.com/jquery-latest.min.js"></script>

    <title>Document</title>
    <script>
        //value -> val(), innerText -> text(), 
        //innerHTML -> html() - 기존 html은 모두 삭제후  추가
        // append(), prepend() - 기존 html에 추가를 해주는 기능 
        $(function(){

            // prepend - 기존 데이터 앞에 데이터 추가
            // append - 기존 데이터 뒤에 데이터 추가
            $("#cbtn").click(function(){
                let hdata="";       // 함수안에 넣어서 초기화를 시켜주면 한번씩 추가 가능!
                //alert("알림창");
                hdata += `<ul>`;
                hdata += `<li>사과</li>`;
                hdata += `<li>배</li>`;
                hdata += `<li>바나나</li>`;
                hdata += `<li>수박</li>`;
                hdata += `<li>딸기</li>`;
                hdata += `</ul>`;
                $(".txt").prepend(hdata);
                $(".txt").append(hdata);
                alert("데이터를 추가했습니다.") ;
            });

            // 여러값 추가 ({"":"", "":"", "":""});
            $("#chg").click(function(){
                $("li").css({"font-size":"30px","border":"1px solid black","color":"red"});
            }); 

            // $(this) - 자기자신의 값을 가져오거나 변경함
            $("li").click(function(){
                console.log($(this).text());
                $(this).css({"font-size":"30px","border":"1px solid black","color":"blue"});
            }); 

            // 소
            $("img").click(function(){
                console.log($(this).attr("src"));
                $(this).removeAttr("alt");
            });

        }); // jquery
    </script>
    <style>
        li{}
    </style>
</head>
<body>
    <div class="txt">
        <ul>
            <li>스위스</li>
            <li>이탈리아</li>
            <li>프랑스</li>
        </ul>
    </div>
    <img src="images/best01.jpg"  alt="상품이미지">
    <button id="cbtn">추가</button>
    <button id="chg">변경</button>
</body>
</html>
