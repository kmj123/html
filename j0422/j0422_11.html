        // 1-10까지 숫자로 랜덤으로 숫자 맞추기 게임
        let ran1 = parseInt(10*Math.random())+1;
        
        //입력값이 크면 크다, 작으면 작다, 맞으면 정답
        // 5번 반복
        let i = 0;
        let input = 0;

        while(i<5){
            input = prompt("숫자를 입력하세요>>");
            if(ran1 < input){
                alert("입력값이 더 큽니다.","<br>");
            }else if(ran1 > input){
                alert("입력값이 더 작습니다.","<br>");
            }else{
                alert("정답!","<br>");
                break;
            }
            i++;
        }
        document.write("랜덤숫자: ",ran1,"<br>");
        document.write("입력숫자: ",input,"<br>");
