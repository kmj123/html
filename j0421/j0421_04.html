<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" type="text/css" href="css/style.css">
    <script>
        console.log("안녕");
        // alert("안녕");
        // aler("안녕"); //에러코드 console창에 에러를 확인해줌.

        // js 변수 - boolean, int, float: Number, str -> 파이썬 변수 - bool, str, int, float 
        let a = 1; //숫자: 정수형
        let b = 10.25;  //숫자: 실수형
        let c = "안녕" // 문자형
        let d = true; // 논리형
        console.log("a: " +a);
        console.log("b: " +b);  // 파이썬 다른타입을 + 연산시 에러
        console.log("c: " +c);
        console.log("d: " +d);
        console.log(typeof(a)); //number타입
        console.log(typeof(b)); //number타입 
        console.log(typeof(c)); //string타입
        console.log(typeof(d)); //boolean타입
    </script>
    

</head>
<body>


</body>
</html>
